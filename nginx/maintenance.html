<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talio HRMS — Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background: #f0f4f8;
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            padding: 3rem 2.5rem;
            max-width: 480px;
            text-align: center;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #0f172a;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            color: #64748b;
            margin-bottom: 1.5rem;
        }

        .retry-btn {
            display: inline-block;
            padding: 0.65rem 1.75rem;
            background: #0066FF;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .retry-btn:hover {
            background: #0052cc;
        }

        .meta {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #94a3b8;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">🔧</div>
        <h1>We'll be right back</h1>
        <p>
            Talio HRMS is currently undergoing scheduled maintenance or a deployment update.
            This usually takes less than a minute.
        </p>
        <a class="retry-btn" href="javascript:location.reload()">Try Again</a>
        <div class="meta">If this persists for more than 5 minutes, contact your administrator.</div>
    </div>
</body>

</html>
