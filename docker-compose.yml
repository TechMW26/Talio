services:
  talio-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talio-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads_data:/app/public/uploads
    networks:
      - talio-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: talio-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/maintenance.html:/usr/share/nginx/html/maintenance.html:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_var:/var/lib/letsencrypt
      - webroot:/var/www/certbot
    depends_on:
      talio-app:
        condition: service_healthy
    networks:
      - talio-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot
    container_name: talio-certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - webroot:/var/www/certbot
    # No entrypoint override — the deploy script and cron call
    # `docker compose run --rm certbot certonly ...` or `certbot renew` directly.
    networks:
      - talio-network

volumes:
  uploads_data:
  certbot_etc:
  certbot_var:
  webroot:

networks:
  talio-network:
    driver: bridge
