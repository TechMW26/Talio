<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Updating Talio</title>
  <style>
    :root { color-scheme: dark; --mint:#91d4bd; --text:#f1f4f2; --muted:#a2ada7; --track:#2a3830; }
    * { box-sizing:border-box; }
    html { height:100%; background:#09090b; border-radius:24px; overflow:hidden; }
    body { margin:0; min-height:100%; height:100dvh; color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:radial-gradient(ellipse at 50% 40%,#172a23 0%,#0d1310 30%,#09090b 68%); display:flex; flex-direction:column; border-radius:24px; overflow:auto; -webkit-app-region:drag; user-select:none; }
    header { padding:22px 32px 18px 96px; flex-shrink:0; }
    .brand-logo { display:block; width:36px; height:39px; }
    main { flex:1 0 auto; display:flex; align-items:center; justify-content:center; padding:32px 24px 48px; min-width:0; -webkit-app-region:no-drag; }
    .container { width:100%; max-width:540px; text-align:center; display:flex; flex-direction:column; align-items:center; }
    .eyebrow { color:var(--mint); letter-spacing:2px; font-size:11px; font-weight:600; margin:0; }
    .progress-ring { --progress:0%; width:184px; height:184px; padding:3px; margin:30px auto 28px; border-radius:50%; background:conic-gradient(var(--mint) var(--progress),var(--track) 0); }
    .ring-inner { width:100%; height:100%; background:#101a15; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
    .progress-value { font-size:54px; font-weight:450; letter-spacing:-2px; line-height:1; font-variant-numeric:tabular-nums; }
    .progress-unit { color:var(--muted); font-size:23px; margin-left:3px; letter-spacing:0; }
    .ring-label { color:var(--mint); font-size:10px; letter-spacing:1.3px; }
    h1 { font-size:clamp(26px,3vw,36px); font-weight:500; letter-spacing:-1px; line-height:1.2; margin:0 0 14px; text-wrap:balance; }
    .subtitle { color:var(--muted); font-size:15px; line-height:1.6; margin:0; }
    .versions { display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:12px; margin:24px 0 0; font-size:13px; color:var(--muted); overflow-wrap:anywhere; max-width:100%; }
    .version-new { color:var(--mint); background:#1b3026; padding:6px 14px; border-radius:24px; }
    .steps { display:flex; align-items:center; justify-content:center; gap:12px; margin:24px 0 0; padding:0; list-style:none; font-size:12px; color:var(--muted); }
    .step { display:flex; align-items:center; gap:12px; }
    .step+.step::before { content:''; height:1px; width:26px; background:#354039; }
    .step.active,.step.done { color:var(--mint); }
    .step.active { font-weight:600; }
    .detail { min-height:20px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; margin:20px 0 0; line-height:1.6; overflow-wrap:anywhere; max-width:100%; }
    footer { flex-shrink:0; padding:22px 30px; border-top:1px solid #202823; display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; font-size:12px; color:var(--muted); }
    .error { background:#291b1b; border:1px solid #573333; color:#ffc6c1; font-size:13px; padding:14px 18px; border-radius:14px; margin:24px 0 0; line-height:1.6; overflow-wrap:anywhere; -webkit-app-region:no-drag; user-select:text; }
    button { background:var(--mint); color:#10251b; border:0; border-radius:12px; padding:12px 24px; margin-top:16px; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; -webkit-app-region:no-drag; }
    button:hover { background:#b0e5d1; }
    button:focus-visible { outline:2px solid var(--mint); outline-offset:4px; }
    button:disabled { opacity:.6; cursor:wait; }
    [hidden] { display:none !important; }
    body[data-state="error"] .progress-ring { background:#a85c58; }
    body[data-state="complete"] .progress-ring { background:var(--mint); }
    @media (max-width:480px) {
      header { padding:18px 24px 14px 88px; }
      main { padding:24px 20px 32px; }
      footer { padding:16px 20px; font-size:11px; gap:8px 16px; }
      .progress-ring { width:148px; height:148px; margin:24px auto; }
      .progress-value { font-size:46px; }
      .eyebrow { font-size:10px; letter-spacing:1.5px; line-height:1.6; }
      .subtitle { font-size:14px; }
      .steps,.step { gap:8px; }
      .step+.step::before { width:18px; }
    }
    @media (max-height:600px) {
      header { padding-top:14px; padding-bottom:10px; }
      .brand-logo { width:30px; height:33px; }
      main { padding:12px 20px 24px; }
      .progress-ring { width:112px; height:112px; margin:18px auto 20px; }
      .progress-value { font-size:36px; }
      .ring-inner { gap:8px; }
      h1 { font-size:26px; margin-bottom:12px; }
      .versions,.steps { margin-top:18px; }
      .detail { margin-top:16px; }
      footer { padding-top:12px; padding-bottom:12px; }
    }
  </style>
</head>
<body data-state="preparing">
  <header>
    <!-- The same Talio fox artwork used by the desktop loader; available offline. -->
    <svg class="brand-logo" role="img" aria-label="Talio" viewBox="0 0 385.322 416.819" xmlns="http://www.w3.org/2000/svg">

    </svg>
  </header>
  <main>
    <section class="container" aria-labelledby="title">
      <p class="eyebrow">A LITTLE BETTER, EVERY TIME</p>
      <div class="progress-ring" id="progressBar" role="progressbar" aria-label="Update download" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="ring-inner"><div class="progress-value"><span id="progressValue">0</span><span class="progress-unit" id="progressUnit">%</span></div><span class="ring-label" id="progressLabel">PREPARING</span></div>
      </div>
      <h1 id="title">Making room for better.</h1>
      <p class="subtitle" id="subtitle">The next Talio is on its way.</p>
      <div class="versions" id="versionRow" hidden><span id="oldVer"></span><span aria-label="updating to">→</span><span class="version-new" id="newVer"></span></div>
      <ol class="steps" aria-label="Update stages"><li class="step active" id="step1" aria-current="step">Download</li><li class="step" id="step2">Verify</li><li class="step" id="step3">Install</li></ol>
      <p class="detail" id="progressDetail">Preparing your update…</p>
      <p class="error" id="errorMsg" role="alert" hidden></p>
      <button id="retryBtn" type="button" hidden>Try again</button>
    </section>
  </main>
  <footer><span>Talio desktop</span><span id="footerStatus" role="status" aria-live="polite">Preparing your update</span></footer>
  <script>
    (() => {
      const get = id => document.getElementById(id);
      const ring = get('progressBar');
      let state = 'preparing';
      function progress(value) {
        const number = Number(value);
        const percent = Number.isFinite(number) ? Math.min(100, Math.max(0, Math.round(number))) : 0;
        ring.style.setProperty('--progress', percent + '%');
        ring.setAttribute('aria-valuenow', String(percent));
        get('progressValue').textContent = String(percent);
      }
      function stage(next, heading, subtitle, label, detail, step) {
        state = next;
        document.body.dataset.state = next;
        get('title').textContent = heading;
        get('subtitle').textContent = subtitle;
        get('progressLabel').textContent = label;
        get('progressDetail').textContent = detail;
        get('footerStatus').textContent = label.charAt(0) + label.slice(1).toLowerCase();
        for (let i=1;i<=3;i++) {
          get('step'+i).className = 'step' + (i < step ? ' done' : i === step ? ' active' : '');
          if (i===step) get('step'+i).setAttribute('aria-current','step');
          else get('step'+i).removeAttribute('aria-current');
        }
      }
      function reset() {
        get('errorMsg').hidden = true;
        get('retryBtn').hidden = true;
        get('progressUnit').hidden = false;
        progress(0);
        stage('preparing','Making room for better.','The next Talio is on its way.','PREPARING','Preparing your update…',1);
      }
      function formatBytes(value) {
        const bytes = Math.max(0, Number(value) || 0);
        if (bytes < 1024) return Math.round(bytes) + ' B';
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1048576).toFixed(1) + ' MB';
      }
      function fail(message) {
        stage('error','Let’s try that again.','Talio couldn’t finish this update.','UPDATE PAUSED','Your update has stopped.',0);
        get('errorMsg').textContent = message || 'Please check your connection and try again.';
        get('errorMsg').hidden = false;
        get('retryBtn').hidden = false;
      }
      window.addEventListener('message', event => {
        // Progress is posted by the main process into this same local window.
        if (event.source && event.source !== window) return;
        const data = event.data;
        if (!data || typeof data.type !== 'string') return;
        switch (data.type) {
          case 'update-versions':
            if (typeof data.current === 'string' && typeof data.latest === 'string') {
              get('oldVer').textContent = 'v' + data.current;
              get('newVer').textContent = 'v' + data.latest;
              get('versionRow').hidden = false;
            }
            break;
          case 'update-progress':
            if (!['preparing','downloading'].includes(state)) return;
            stage('downloading','Making room for better.','The next Talio is on its way.','DOWNLOADING','',1);
            progress(data.percent);
            get('progressDetail').textContent = formatBytes(data.transferred) + (data.total > 0 ? ' / ' + formatBytes(data.total) : '') + (data.bytesPerSecond > 0 ? ' · ' + formatBytes(data.bytesPerSecond) + '/s' : '');
            break;
          case 'update-verifying':
            progress(100);
            stage('verifying','A quick final check.','Checking your downloaded update.','VERIFYING','Preparing the update files…',2);
            break;
          case 'update-downloaded':
            progress(100);
            stage('downloaded','Your download is ready.','Talio will install the update next.','DOWNLOADED','Preparing to install…',2);
            break;
          case 'update-installing':
            progress(100);
            stage('installing','Almost back to your day.','Putting the finishing touches on Talio.','INSTALLING','Talio will restart when the update is ready.',3);
            break;
          case 'update-complete':
            progress(100);
            stage('complete','You’re all set.','The latest Talio is ready. Restarting now…','COMPLETE','See you in a moment.',4);
            get('progressValue').textContent = '✓';
            get('progressUnit').hidden = true;
            break;
          case 'update-error': fail(typeof data.message === 'string' ? data.message : ''); break;
        }
      });
      get('retryBtn').addEventListener('click', async () => {
        get('retryBtn').disabled = true;
        reset();
        try {
          if (!window.electronAPI?.retryUpdate) throw new Error('Please close and reopen Talio to retry the update.');
          await window.electronAPI.retryUpdate();
        } catch (error) { fail(error.message); }
        finally { get('retryBtn').disabled = false; }
      });
    })();
  </script>
</body>
</html>
