<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talio - Updating</title>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-500: #3B82F6;
      --primary-600: #2563EB;
      --primary-700: #1D4ED8;
      --primary-900: #1E3A8A;
      --talio-teal: #7DBCAF;
      --success: #10B981;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Raleway', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(145deg, #F8FAFC 0%, #EFF6FF 50%, #F0FDF4 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }
    .container {
      text-align: center;
      max-width: 460px;
      padding: 40px;
      animation: fadeIn 0.5s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Logo animation */
    .logo-wrap {
      width: 96px; height: 96px;
      margin: 0 auto 32px;
      position: relative;
    }
    .logo-wrap svg { width: 100%; height: 100%; }

    /* Phase: Checking */
    .phase-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .phase-sub {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 32px;
      line-height: 1.5;
    }

    /* Version badges */
    .version-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .ver-badge {
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
    .ver-old {
      background: #FEE2E2;
      color: #DC2626;
      text-decoration: line-through;
    }
    .ver-arrow {
      color: var(--text-muted);
      font-size: 18px;
    }
    .ver-new {
      background: #D1FAE5;
      color: #059669;
    }

    /* Progress bar */
    .progress-wrap {
      width: 100%;
      height: 8px;
      background: #E2E8F0;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary-500), var(--talio-teal));
      border-radius: 99px;
      transition: width 0.4s ease;
    }
    .progress-text {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 6px;
    }
    .progress-detail {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    /* Steps */
    .steps {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 8px;
    }
    .step {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      transition: color 0.3s;
    }
    .step.active { color: var(--primary-600); }
    .step.done { color: var(--success); }
    .step-dot {
      width: 20px; height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      background: #E2E8F0;
      color: var(--text-muted);
      transition: all 0.3s;
    }
    .step.active .step-dot { background: var(--primary-500); color: white; }
    .step.done .step-dot { background: var(--success); color: white; }

    /* Completion state */
    .complete-check {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #D1FAE5, #A7F3D0);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      animation: scaleIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.3); }
      to { opacity: 1; transform: scale(1); }
    }
    .complete-check svg {
      width: 32px; height: 32px;
      stroke: #059669; stroke-width: 3; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .complete-check svg path {
      stroke-dasharray: 40;
      stroke-dashoffset: 40;
      animation: drawCheck 0.5s 0.3s forwards;
    }
    @keyframes drawCheck { to { stroke-dashoffset: 0; } }

    .hide { display: none !important; }

    /* Error state */
    .error-msg {
      margin-top: 16px;
      padding: 12px 20px;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 10px;
      color: #DC2626;
      font-size: 13px;
      font-weight: 500;
    }
    .btn-retry {
      margin-top: 16px;
      padding: 10px 24px;
      border-radius: 10px;
      background: var(--primary-500);
      color: white;
      border: none;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      -webkit-app-region: no-drag;
      transition: background 0.2s;
    }
    .btn-retry:hover { background: var(--primary-600); }
  </style>
</head>
<body>
  <!-- Downloading / Installing state -->
  <div class="container" id="updateView">
    <div class="logo-wrap">
      <svg viewBox="0 0 385.322 416.819" xmlns="http://www.w3.org/2000/svg">

85 45.725 129.349 67.095 162.839ZM311.415 164.889L314.195 168.259L316.245 165.679C319.605 161.459 329.665 142.809 334.825 131.259C341.895 115.409 346.765 101.229 350.355 86.0085C351.205 82.4385 352.325 77.7085 352.845 75.5085C353.375 73.3085 354.015 70.1585 354.275 68.5085C356.185 56.2785 356.765 50.4385 356.785 43.1485L356.805 34.7885L354.055 35.4685C349.035 36.7085 334.085 43.7585 323.425 49.8985C309.895 57.6885 298.105 66.0185 284.055 77.7185C271.155 88.4585 249.535 109.769 250.295 110.999C250.575 111.449 255.395 115.099 261.005 119.099C277.805 131.089 300.715 151.909 311.415 164.889ZM133.395 304.289L141.305 312.679L154.965 302.299C162.485 296.589 169.175 291.269 169.835 290.469C170.805 289.299 170.225 287.719 166.805 282.269C148.655 253.309 123.965 230.579 96.805 217.809C92.685 215.869 86.165 213.039 82.335 211.529L75.365 208.769L72.695 211.979C64.785 221.449 50.405 265.279 55.535 264.269C57.955 263.789 78.115 268.159 85.145 270.699C101.125 276.459 118.685 288.679 133.395 304.289ZM238.005 307.059L245.035 312.599L256.675 301.009C269.605 288.119 283.235 278.369 296.305 272.679C304.535 269.089 321.045 265.009 327.315 265.009C331.755 265.009 332.365 263.579 330.815 256.769C327.495 242.159 315.305 211.669 311.955 209.599C309.355 207.999 284.825 219.279 270.805 228.539C257.485 237.329 247.035 246.559 237.645 257.829C230.125 266.859 215.805 287.399 215.805 289.159C215.805 289.589 219.215 292.539 223.395 295.719C227.565 298.909 234.145 304.009 238.005 307.059ZM184.085 373.029L193.035 378.929L197.175 376.829C202.805 373.959 214.415 365.089 219.415 359.829C224.665 354.299 233.805 342.059 233.805 340.549C233.805 339.429 231.465 337.619 217.805 328.119C196.395 313.249 193.945 311.869 191.475 313.229C188.405 314.909 159.105 335.289 155.525 338.229L152.755 340.509L156.175 345.569C162.345 354.679 174.735 366.869 184.085 373.029Z"/>
      </svg>
    </div>

    <h1 class="phase-title" id="title">Updating Talio</h1>
    <p class="phase-sub" id="subtitle">A new version is available. Downloading the latest update for you...</p>

    <div class="version-row" id="versionRow">
      <span class="ver-badge ver-old" id="oldVer">v4.2.0</span>
      <span class="ver-arrow">→</span>
      <span class="ver-badge ver-new" id="newVer">v4.3.0</span>
    </div>

    <div id="progressSection">
      <p class="progress-text" id="progressLabel">Downloading... 0%</p>
      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <p class="progress-detail" id="progressDetail">Preparing download...</p>
    </div>

    <div class="steps" id="steps">
      <div class="step active" id="step1"><span class="step-dot">1</span> Download</div>
      <div class="step" id="step2"><span class="step-dot">2</span> Verify</div>
      <div class="step" id="step3"><span class="step-dot">3</span> Install</div>
    </div>

    <div class="error-msg hide" id="errorMsg"></div>
    <button class="btn-retry hide" id="retryBtn" onclick="retry()">Try Again</button>
  </div>

  <!-- Completion state -->
  <div class="container hide" id="completeView">
    <div class="complete-check">
      <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
    </div>
    <h1 class="phase-title">Update Complete!</h1>
    <p class="phase-sub">Talio has been updated successfully. Restarting now...</p>
  </div>

  <script>
    var progressBar = document.getElementById('progressBar');
    var progressLabel = document.getElementById('progressLabel');
    var progressDetail = document.getElementById('progressDetail');
    var title = document.getElementById('title');
    var subtitle = document.getElementById('subtitle');
    var errorMsg = document.getElementById('errorMsg');
    var retryBtn = document.getElementById('retryBtn');
    var step1 = document.getElementById('step1');
    var step2 = document.getElementById('step2');
    var step3 = document.getElementById('step3');
    var updateView = document.getElementById('updateView');
    var completeView = document.getElementById('completeView');
    var versionRow = document.getElementById('versionRow');
    var oldVer = document.getElementById('oldVer');
    var newVer = document.getElementById('newVer');

    // Listen for update progress messages from main process
    window.addEventListener('message', function(event) {
      var data = event.data;
      if (!data || !data.type) return;

      switch (data.type) {
        case 'update-versions':
          oldVer.textContent = 'v' + data.current;
          newVer.textContent = 'v' + data.latest;
          break;

        case 'update-progress':
          var pct = Math.round(data.percent || 0);
          progressBar.style.width = pct + '%';
          progressLabel.textContent = 'Downloading... ' + pct + '%';
          if (data.bytesPerSecond) {
            var speed = formatBytes(data.bytesPerSecond) + '/s';
            var transferred = formatBytes(data.transferred || 0);
            var total = formatBytes(data.total || 0);
            progressDetail.textContent = transferred + ' / ' + total + '  •  ' + speed;
          }
          break;

        case 'update-downloaded':
          step1.className = 'step done';
          step1.querySelector('.step-dot').innerHTML = '✓';
          step2.className = 'step done';
          step2.querySelector('.step-dot').innerHTML = '✓';
          step3.className = 'step active';
          progressBar.style.width = '100%';
          progressLabel.textContent = 'Download complete!';
          title.textContent = 'Installing Update';
          subtitle.textContent = 'The update has been verified and is being installed. Talio will restart shortly...';
          progressDetail.textContent = 'Cleaning up old files and applying update...';
          break;

        case 'update-installing':
          step3.className = 'step active';
          title.textContent = 'Installing...';
          subtitle.textContent = 'Applying the update and cleaning up. Please wait...';
          break;

        case 'update-complete':
          updateView.classList.add('hide');
          completeView.classList.remove('hide');
          break;

        case 'update-error':
          errorMsg.textContent = data.message || 'An error occurred during the update. Please try again.';
          errorMsg.classList.remove('hide');
          retryBtn.classList.remove('hide');
          progressLabel.textContent = 'Update failed';
          progressBar.style.width = '0%';
          progressBar.style.background = '#EF4444';
          break;

        case 'update-verifying':
          step1.className = 'step done';
          step1.querySelector('.step-dot').innerHTML = '✓';
          step2.className = 'step active';
          progressLabel.textContent = 'Verifying download...';
          progressDetail.textContent = 'Checking file integrity...';
          break;
      }
    });

    function retry() {
      errorMsg.classList.add('hide');
      retryBtn.classList.add('hide');
      progressBar.style.background = '';
      progressBar.style.width = '0%';
      progressLabel.textContent = 'Retrying...';
      progressDetail.textContent = 'Preparing download...';
      step1.className = 'step active';
      step2.className = 'step';
      step3.className = 'step';
      step1.querySelector('.step-dot').innerHTML = '1';
      step2.querySelector('.step-dot').innerHTML = '2';

      if (window.electronAPI && window.electronAPI.retryUpdate) {
        window.electronAPI.retryUpdate();
      } else {
        window.postMessage({ type: 'retry-update' }, '*');
      }
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(1) + ' MB';
    }
  </script>
</body>
</html>
