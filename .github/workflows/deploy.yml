name: Talio CI - Lint Check

# ============================================================
# Lint gate for PRs
# ============================================================
on:
  pull_request:
    branches: [main]
    paths:
      # Source code
      - "talio-web/Talio/app/**"
      - "talio-web/Talio/components/**"
      - "talio-web/Talio/config/**"
      - "talio-web/Talio/contexts/**"
      - "talio-web/Talio/hooks/**"
      - "talio-web/Talio/lib/**"
      - "talio-web/Talio/models/**"
      - "talio-web/Talio/src/**"
      - "talio-web/Talio/styles/**"
      - "talio-web/Talio/utils/**"
      - "talio-web/Talio/public/**"
      # Config that affects build output
      - "talio-web/Talio/package.json"
      - "talio-web/Talio/package-lock.json"
      - "talio-web/Talio/next.config.js"
      - "talio-web/Talio/tailwind.config.js"
      - "talio-web/Talio/postcss.config.js"
      - "talio-web/Talio/middleware.js"
      - "talio-web/Talio/server.js"

# ============================================================
# Jobs
# ============================================================
jobs:
  # ---- Quick lint check (PRs only, skip drafts) ----
  lint:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    defaults:
      run:
        working-directory: talio-web/Talio

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: talio-web/Talio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint --if-present
