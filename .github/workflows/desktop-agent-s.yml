name: Desktop local Agent S builds
on:
  workflow_dispatch:
  push:
    tags:
      - 'v6.0.24'
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin
            arch: arm64
            target: mac
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            target: mac
          - runner: windows-2022
            platform: win32
            arch: x64
            target: win
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            target: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux runtime utilities
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 xclip x11-utils wmctrl xvfb
      - run: npm ci
        working-directory: desktop-app
      - name: Build local planner runtime
        if: runner.os != 'Linux'
        run: npm run build:agent-s
        working-directory: desktop-app
      - name: Build local planner runtime (X11)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run build:agent-s
        working-directory: desktop-app
      - name: Archive native runtime preserving executable permissions
        run: tar -czf agent-s-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz -C desktop-app/build agent-s-${{ matrix.platform }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: agent-s-${{ matrix.platform }}-${{ matrix.arch }}
          path: agent-s-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: Package desktop (no automatic publication)
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        working-directory: desktop-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop-app/dist/*.dmg
            desktop-app/dist/*.zip
            desktop-app/dist/*.exe
            desktop-app/dist/*.AppImage
            desktop-app/dist/*.deb
          if-no-files-found: error

  publish:
    name: Publish desktop release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete installer set
        run: |
          for asset in Talio-6.0.24-arm64.dmg Talio-6.0.24-arm64.zip Talio-6.0.24-x64.dmg Talio-6.0.24-x64.zip Talio.Setup.6.0.24.exe Talio-6.0.24-x86_64.AppImage Talio-6.0.24-amd64.deb; do
            test -s "release-assets/$asset" || exit 1
          done
          cd release-assets
          sha256sum *.dmg *.zip *.exe *.AppImage *.deb > SHA256SUMS.txt
      - name: Publish v6.0.24
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.0.24
          target_commitish: ${{ github.sha }}
          name: Talio Desktop 6.0.24 — Smarter MIRA desktop actions
          draft: true
          prerelease: false
          generate_release_notes: false
          body: |
            MIRA can execute short, predictable input sequences from one screenshot. Opening a URL focuses the browser address bar, types the URL and presses Enter as one observation-grounded action. Navigation reuses the current browser tab by default; new tabs require an explicit request.

            Both desktop planners prioritise the shortest reliable route using documented shortcuts and verified accessibility targets. Channel hints distinguish email, WhatsApp and app-specific DMs; recipient and send-result verification remain required. Interrupted or uncertain batches stop without replaying partial input. Known web-app fallbacks use the current-tab navigation flow rather than the OS URL launcher.

            Includes recent shared UI refinements: attendance status colours, consistent dropdown arrow spacing, transparent tab shells, compact headings and upload controls, and sidebar/settings spacing fixes. Web interface changes are delivered through the hosted Talio app.

            Validated with 2,793 automated tests, eight Python action tests, a production web build and packaged Agent S smoke tests. 348 tests were skipped by their existing conditions. CI builds macOS Apple Silicon and Intel, Windows x64, and Linux x64 installers with freshly rebuilt local Agent S runtimes. Hands-on browser/message acceptance on every operating system has not been performed.

            Signing: CI packages are not Developer ID signed or Apple notarized; Windows packages are unsigned. macOS desktop control requires macOS 14+, Accessibility and Screen Recording approval. Linux desktop control requires X11.
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.zip
            release-assets/**/*.exe
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/SHA256SUMS.txt
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify uploaded assets and publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v6.0.24 --repo "${{ github.repository }}" --json assets --jq '.assets' | node -e '
            let text = "";
            process.stdin.on("data", chunk => text += chunk);
            process.stdin.on("end", () => {
              const assets = JSON.parse(text);
              const expected = ["Talio-6.0.24-arm64.dmg", "Talio-6.0.24-arm64.zip", "Talio-6.0.24-x64.dmg", "Talio-6.0.24-x64.zip", "Talio.Setup.6.0.24.exe", "Talio-6.0.24-x86_64.AppImage", "Talio-6.0.24-amd64.deb", "SHA256SUMS.txt"];
              for (const name of expected) {
                const asset = assets.find(item => item.name === name);
                if (!asset || asset.size < (name.endsWith(".txt") ? 100 : 1048576)) throw new Error("Missing or truncated release asset: " + name);
              }
            });'
          gh release edit v6.0.24 --repo "${{ github.repository }}" --draft=false --latest
