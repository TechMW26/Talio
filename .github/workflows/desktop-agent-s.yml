name: Desktop local Agent S builds
on:
  workflow_dispatch:
    inputs:
      desktop_acceptance_verified:
        description: 'Signed-app desktop control and update permission continuity have passed hands-on acceptance'
        type: boolean
        required: true
        default: false
      signed_unnotarized_release:
        description: 'Owner-approved 6.0.34 release: retain Developer ID signing, skip notarization, disclose remaining acceptance limits'
        type: boolean
        required: true
        default: false
  push:
    tags:
      - 'v6.0.34'
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin
            arch: arm64
            target: mac
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            target: mac
          - runner: windows-2022
            platform: win32
            arch: x64
            target: win
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            target: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux runtime utilities
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 xclip x11-utils wmctrl xvfb
      - run: npm ci
        working-directory: desktop-app
      - name: Require macOS release signing credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNED_UNNOTARIZED_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_unnotarized_release && 'true' || 'false' }}
        run: |
          required_secrets='CSC_LINK CSC_KEY_PASSWORD APPLE_TEAM_ID'
          if [ "$SIGNED_UNNOTARIZED_RELEASE" != 'true' ]; then
            required_secrets="$required_secrets APPLE_ID APPLE_ID_PASSWORD"
          fi
          for name in $required_secrets; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing macOS signing/notarization secret: $name. Refusing to produce an ad-hoc release."
              exit 1
            fi
          done
          test "$APPLE_TEAM_ID" = '37R3XLT7BG' || { echo '::error::Apple Team ID does not match the Talio signing policy'; exit 1; }
      - name: Build local planner runtime
        if: runner.os != 'Linux'
        run: npm run build:agent-s
        working-directory: desktop-app
      - name: Build local planner runtime (X11)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run build:agent-s
        working-directory: desktop-app
      - name: Archive native runtime preserving executable permissions
        run: tar -czf agent-s-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz -C desktop-app/build agent-s-${{ matrix.platform }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: agent-s-${{ matrix.platform }}-${{ matrix.arch }}
          path: agent-s-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: Package desktop (no automatic publication)
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        working-directory: desktop-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && 'true' || 'false' }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_ID_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_ID_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          REQUIRE_NOTARIZATION: ${{ runner.os == 'macOS' && 'true' || 'false' }}
          TALIO_SIGNED_UNNOTARIZED_RELEASE: ${{ runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.signed_unnotarized_release && '6.0.34' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop-app/dist/*.dmg
            desktop-app/dist/*.zip
            desktop-app/dist/*.exe
            desktop-app/dist/*.AppImage
            desktop-app/dist/*.deb
          if-no-files-found: error

  publish:
    name: Publish desktop release
    needs: build
    # Build artifacts are not proof of desktop task completion or TCC continuity.
    if: github.event_name == 'workflow_dispatch' && (inputs.desktop_acceptance_verified || inputs.signed_unnotarized_release)
    runs-on: ubuntu-22.04
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete installer set
        run: |
          for asset in Talio-6.0.34-arm64.dmg Talio-6.0.34-arm64.zip Talio-6.0.34-x64.dmg Talio-6.0.34-x64.zip Talio.Setup.6.0.34.exe Talio-6.0.34-x86_64.AppImage Talio-6.0.34-amd64.deb; do
            test -s "release-assets/$asset" || exit 1
          done
          cd release-assets
          sha256sum *.dmg *.zip *.exe *.AppImage *.deb > SHA256SUMS.txt
      - name: Publish v6.0.34
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.0.34
          target_commitish: ${{ github.sha }}
          name: Talio Desktop 6.0.34 — Mira orchestration, reminders and search
          draft: true
          prerelease: false
          generate_release_notes: false
          body: |
            Release mode: ${{ inputs.signed_unnotarized_release && 'Owner-approved signed but UNNOTARIZED macOS release. Apple Gatekeeper may require manual approval; this release does not claim Apple notarization or completed cross-platform hands-on/update-permission-continuity acceptance.' || 'Developer ID signed and Apple notarized macOS release.' }}

            New in 6.0.34: dependency-aware Mira task orchestration with execution receipts, bounded retries and verified desktop completion. Added authenticated internet research, recoverable reminder delivery and opt-in account-isolated attention cards. Updated loading states with ASCII skeleton/reveal and lightweight popup transitions.

            Automated validation covers task dependencies, uncertain writes, authorization, reminders, search and UI regressions. Hosted features require the corresponding web deployment. External WhatsApp/phone accounts and full standalone/Talio account linking are not included; no always-on or sub-250 ms claim is made. Native cross-platform hands-on and signed-update permission continuity remain unverified for this release.

            Fixed desktop-task continuity across voice confirmations and retries, preserving the original app, song and action rather than executing a standalone "yes". Installed-app-first activation now covers explicit music playback requests; visual verification still determines completion. Jev remains removed.

            Preserved bounded account-isolated caches, explicit-task music preferences, permission checks, focus protection and safe retries. No passive activity monitoring is used.

            Camera preview uses the notch edge with square top corners, bottom-only curves and height derived from the camera aspect ratio. Removed the camera status row, dot and close button; voice camera-off, conversation closure and automatic shutdown remain. The chat-style edge animation stops immediately when a decoded nonblank frame is captured, before remote analysis completes.

            Removed waiting fillers. Direct DeepSeek replies start streaming meaningful completed clauses to selected-voice ElevenLabs v4 PCM speech, with automatic normalization and 1.2x delivery. The sole wake word is "Mira" with higher confidence and cooldown protection; semantic farewell tool calls close even when accompanied by a short goodbye.

            Reduced hidden-window rendering and robot animation work while preserving active voice, camera and desktop-control activity. No universal frame-rate or sub-250 ms latency claim is made.

            Mac packages retain stable Developer ID and helper identities. Windows packages are unsigned. macOS control requires macOS 14+, Accessibility and Screen Recording; Linux control requires X11. Windows/Linux hardware camera/audio acceptance and installed-update permission continuity are not claimed. Hosted web changes are delivered separately.

            CI verifies all seven installers and uploaded SHA-256 digests before publication.
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.zip
            release-assets/**/*.exe
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/SHA256SUMS.txt
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify uploaded assets and publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v6.0.34 --repo "${{ github.repository }}" --json assets --jq '.assets' | node -e '
            let text = "";
            process.stdin.on("data", chunk => text += chunk);
            process.stdin.on("end", () => {
              const assets = JSON.parse(text);
              const expected = ["Talio-6.0.34-arm64.dmg", "Talio-6.0.34-arm64.zip", "Talio-6.0.34-x64.dmg", "Talio-6.0.34-x64.zip", "Talio.Setup.6.0.34.exe", "Talio-6.0.34-x86_64.AppImage", "Talio-6.0.34-amd64.deb", "SHA256SUMS.txt"];
              for (const name of expected) {
                const asset = assets.find(item => item.name === name);
                if (!asset || asset.size < (name.endsWith(".txt") ? 100 : 1048576)) throw new Error("Missing or truncated release asset: " + name);
                const file = require("fs").readFileSync("release-assets/" + name);
                const digest = "sha256:" + require("crypto").createHash("sha256").update(file).digest("hex");
                if (asset.digest !== digest) throw new Error("Uploaded asset checksum mismatch: " + name);
              }
            });'
          gh release edit v6.0.34 --repo "${{ github.repository }}" --draft=false --latest
