name: Desktop local Agent S builds
on:
  workflow_dispatch:
    inputs:
      desktop_acceptance_verified:
        description: 'Signed-app desktop control and update permission continuity have passed hands-on acceptance'
        type: boolean
        required: true
        default: false
  push:
    tags:
      - 'v6.0.31'
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin
            arch: arm64
            target: mac
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            target: mac
          - runner: windows-2022
            platform: win32
            arch: x64
            target: win
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            target: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux runtime utilities
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 xclip x11-utils wmctrl xvfb
      - run: npm ci
        working-directory: desktop-app
      - name: Require macOS release signing credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_ID_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing macOS signing/notarization secret: $name. Refusing to produce an ad-hoc release."
              exit 1
            fi
          done
          test "$APPLE_TEAM_ID" = '37R3XLT7BG' || { echo '::error::Apple Team ID does not match the Talio signing policy'; exit 1; }
      - name: Build local planner runtime
        if: runner.os != 'Linux'
        run: npm run build:agent-s
        working-directory: desktop-app
      - name: Build local planner runtime (X11)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run build:agent-s
        working-directory: desktop-app
      - name: Archive native runtime preserving executable permissions
        run: tar -czf agent-s-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz -C desktop-app/build agent-s-${{ matrix.platform }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: agent-s-${{ matrix.platform }}-${{ matrix.arch }}
          path: agent-s-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: Package desktop (no automatic publication)
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        working-directory: desktop-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && 'true' || 'false' }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_ID_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_ID_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          REQUIRE_NOTARIZATION: ${{ runner.os == 'macOS' && 'true' || 'false' }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop-app/dist/*.dmg
            desktop-app/dist/*.zip
            desktop-app/dist/*.exe
            desktop-app/dist/*.AppImage
            desktop-app/dist/*.deb
          if-no-files-found: error

  publish:
    name: Publish desktop release
    needs: build
    # Build artifacts are not proof of desktop task completion or TCC continuity.
    if: github.event_name == 'workflow_dispatch' && inputs.desktop_acceptance_verified
    runs-on: ubuntu-22.04
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete installer set
        run: |
          for asset in Talio-6.0.31-arm64.dmg Talio-6.0.31-arm64.zip Talio-6.0.31-x64.dmg Talio-6.0.31-x64.zip Talio.Setup.6.0.31.exe Talio-6.0.31-x86_64.AppImage Talio-6.0.31-amd64.deb; do
            test -s "release-assets/$asset" || exit 1
          done
          cd release-assets
          sha256sum *.dmg *.zip *.exe *.AppImage *.deb > SHA256SUMS.txt
      - name: Publish v6.0.31
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.0.31
          target_commitish: ${{ github.sha }}
          name: Talio Desktop 6.0.31 — Native control recovery and stable Mac signing
          draft: true
          prerelease: false
          generate_release_notes: false
          body: |
            Stable Developer ID identities now cover Talio and both desktop-control helpers. Native permission prompts no longer hold the startup loader open, and version-check requests have a bounded deadline. Existing ad-hoc installations may need one final approval when moving to the signed app.

            Mira now observes menu controls, retains a short task-local hybrid plan across proven-not-executed inputs, and discards stale accessibility evidence from later model requests while preserving task and action history. Deterministic exact matching avoids unnecessary Jev calls; uncertain selections retain visual recovery and completion verification.

            The approved Quiet Focus update screen uses the actual Talio logo, responsive spacing and scrollable short-window error states.

            Mira now preserves the original user task and clarification context when confirming desktop actions. Natural English/Hindi retries can reopen an app without the duplicate-send block. Uncertain sends and submissions remain protected; success still requires observed completion.

            Restored settling time after native input, increased visual planning headroom, and added recovery from interrupted model requests using fresh observations. Warm native helpers and guarded Jev selections remain alongside the existing visual fallback, consent, foreground checks, emergency stop and protected-app rules.

            Jev semantic selection currently requires macOS accessibility controls. Windows and Linux use the improved persistent native helper and existing visual planning. TypeSafe credentials remain server-side and are not embedded in installers.

            New PiP windows open bottom-right instead of restoring stale top-left coordinates. Automatic sizing no longer masquerades as a user drag. The transparent floating robot and detail widgets remain; explicit drags are local to the open window. Browser Mira remains an in-page floating bot.

            Broader English/Hindi conversation-ending commands include recognition variants such as "bye Mire". Fixed voice weather location parsing and increased Hindi generation token headroom while keeping replies concise. Web changes arrive through the hosted Talio app.

            Publication requires an explicit signed-desktop acceptance confirmation in the release workflow, in addition to successful platform packaging and macOS notarization. Refer to docs/MIRA_DESKTOP_EXECUTOR_VALIDATION.md for the recorded test scope and limitations.

            CI rebuilds local Agent S runtimes and installers for macOS Apple Silicon and Intel, Windows x64 and Linux x64, then verifies all seven installers and their uploaded SHA-256 digests before publication.

            Signing: macOS packages require the stable Talio Developer ID and Apple notarization; Windows packages are unsigned. Moving from an older ad-hoc macOS build may require one final permission approval. Subsequent releases preserve the app and desktop-helper signing identities. macOS desktop control requires macOS 14+, Accessibility and Screen Recording approval. Linux desktop control requires X11.
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.zip
            release-assets/**/*.exe
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/SHA256SUMS.txt
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify uploaded assets and publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v6.0.31 --repo "${{ github.repository }}" --json assets --jq '.assets' | node -e '
            let text = "";
            process.stdin.on("data", chunk => text += chunk);
            process.stdin.on("end", () => {
              const assets = JSON.parse(text);
              const expected = ["Talio-6.0.31-arm64.dmg", "Talio-6.0.31-arm64.zip", "Talio-6.0.31-x64.dmg", "Talio-6.0.31-x64.zip", "Talio.Setup.6.0.31.exe", "Talio-6.0.31-x86_64.AppImage", "Talio-6.0.31-amd64.deb", "SHA256SUMS.txt"];
              for (const name of expected) {
                const asset = assets.find(item => item.name === name);
                if (!asset || asset.size < (name.endsWith(".txt") ? 100 : 1048576)) throw new Error("Missing or truncated release asset: " + name);
                const file = require("fs").readFileSync("release-assets/" + name);
                const digest = "sha256:" + require("crypto").createHash("sha256").update(file).digest("hex");
                if (asset.digest !== digest) throw new Error("Uploaded asset checksum mismatch: " + name);
              }
            });'
          gh release edit v6.0.31 --repo "${{ github.repository }}" --draft=false --latest
