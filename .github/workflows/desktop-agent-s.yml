name: Desktop local Agent S builds
on:
  workflow_dispatch:
  push:
    tags:
      - 'v6.0.21'
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin
            arch: arm64
            target: mac
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            target: mac
          - runner: windows-2022
            platform: win32
            arch: x64
            target: win
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            target: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux runtime utilities
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 xclip x11-utils wmctrl xvfb
      - run: npm ci
        working-directory: desktop-app
      - name: Build local planner runtime
        if: runner.os != 'Linux'
        run: npm run build:agent-s
        working-directory: desktop-app
      - name: Build local planner runtime (X11)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run build:agent-s
        working-directory: desktop-app
      - name: Archive native runtime preserving executable permissions
        run: tar -czf agent-s-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz -C desktop-app/build agent-s-${{ matrix.platform }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: agent-s-${{ matrix.platform }}-${{ matrix.arch }}
          path: agent-s-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: Package desktop (no automatic publication)
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        working-directory: desktop-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop-app/dist/*.dmg
            desktop-app/dist/*.zip
            desktop-app/dist/*.exe
            desktop-app/dist/*.AppImage
            desktop-app/dist/*.deb
          if-no-files-found: error

  publish:
    name: Publish desktop release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Publish v6.0.21
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.0.21
          target_commitish: ${{ github.sha }}
          name: Talio Desktop 6.0.21 — MIRA and remote support
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            Adds transparent, tenant-scoped remote support: an organization admin requests a session with a reason, the employee explicitly approves or declines, and the employee must separately choose and start screen sharing. A persistent indicator and stop control remain visible throughout the session. Admins are receive-only in LiveKit and may relay commands to the employee's MIRA only during an approved session. Multi-display selection is supported in the desktop app.

            Adds the employee performance-appraisal request and approval workflow, plus MIRA desktop recovery, device context, and improved name matching. Existing MIRA voice preferences, concise responses, and PiP behavior are retained.

            Validation: 33 focused remote-support/meeting tests passed and the production web build completed. CI builds macOS Apple Silicon and Intel, Windows x64, and Linux x64 desktop installers. Interactive acceptance on every OS and a live two-account LiveKit session have not been performed; the service requires configured LiveKit credentials.

            Signing: CI packages are not Developer ID signed or Apple notarized; Windows packages are unsigned. macOS desktop control requires macOS 14+, Accessibility and Screen Recording approval. Linux desktop control requires X11.
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.zip
            release-assets/**/*.exe
            release-assets/**/*.AppImage
            release-assets/**/*.deb
          token: ${{ secrets.GITHUB_TOKEN }}
