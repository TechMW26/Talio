name: Desktop local Agent S builds
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin
            arch: arm64
            target: mac
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            target: mac
          - runner: windows-2022
            platform: win32
            arch: x64
            target: win
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            target: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux runtime utilities
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 xclip x11-utils wmctrl xvfb
      - run: npm ci
        working-directory: desktop-app
      - name: Build local planner runtime
        if: runner.os != 'Linux'
        run: npm run build:agent-s
        working-directory: desktop-app
      - name: Build local planner runtime (X11)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run build:agent-s
        working-directory: desktop-app
      - name: Archive native runtime preserving executable permissions
        run: tar -czf agent-s-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz -C desktop-app/build agent-s-${{ matrix.platform }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: agent-s-${{ matrix.platform }}-${{ matrix.arch }}
          path: agent-s-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: Package desktop (no automatic publication)
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        working-directory: desktop-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop-app/dist/*.dmg
            desktop-app/dist/*.zip
            desktop-app/dist/*.exe
            desktop-app/dist/*.AppImage
            desktop-app/dist/*.deb
          if-no-files-found: error

  publish:
    name: Publish desktop release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Publish v6.0.20
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.0.20
          target_commitish: ${{ github.sha }}
          name: Talio Desktop 6.0.20 — MIRA voice and personalization
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            MIRA uses a compact 400 × 120 external PiP with scrollable content. Native live windows open at bottom-right on first use, then remember the user's dragged position locally and clamp it to the current display.

            Closing the external MIRA PiP does not intentionally foreground Talio on macOS. The draggable PiP position persists locally. MIRA's separate cursor overlay reasserts the highest supported desktop window level when it moves.

            MIRA replies are short and targeted by default, with longer explanations only when needed or requested. Send Wishes now sends birthday and anniversary greetings through private Talio chat, with sending, success, error and partial-retry handling.

            Settings now include a personal MIRA tab with six ElevenLabs voice choices, audio previews, saved per-user voice selection, and bounded personal instructions/knowledge. The default voice is jJ0Hr51MaPgsgfPtFdR4; voice previews and spoken replies use the saved user choice.

            Validation: CI builds macOS Apple Silicon and Intel, Windows x64, and Linux x64 desktop installers. Interactive acceptance on every OS has not been performed. ElevenLabs voice previews require the selected voice to be available to the configured provider account.

            Signing: CI packages are not Developer ID signed or Apple notarized; Windows packages are unsigned. macOS desktop control requires macOS 14+, Accessibility and Screen Recording approval. Linux desktop control requires X11.
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.zip
            release-assets/**/*.exe
            release-assets/**/*.AppImage
            release-assets/**/*.deb
          token: ${{ secrets.GITHUB_TOKEN }}
