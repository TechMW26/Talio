name: Desktop local Agent S builds
on:
  workflow_dispatch:
  push:
    tags:
      - 'v6.0.29'
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin
            arch: arm64
            target: mac
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            target: mac
          - runner: windows-2022
            platform: win32
            arch: x64
            target: win
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            target: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux runtime utilities
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 xclip x11-utils wmctrl xvfb
      - run: npm ci
        working-directory: desktop-app
      - name: Build local planner runtime
        if: runner.os != 'Linux'
        run: npm run build:agent-s
        working-directory: desktop-app
      - name: Build local planner runtime (X11)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run build:agent-s
        working-directory: desktop-app
      - name: Archive native runtime preserving executable permissions
        run: tar -czf agent-s-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz -C desktop-app/build agent-s-${{ matrix.platform }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: agent-s-${{ matrix.platform }}-${{ matrix.arch }}
          path: agent-s-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: Package desktop (no automatic publication)
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        working-directory: desktop-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop-app/dist/*.dmg
            desktop-app/dist/*.zip
            desktop-app/dist/*.exe
            desktop-app/dist/*.AppImage
            desktop-app/dist/*.deb
          if-no-files-found: error

  publish:
    name: Publish desktop release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete installer set
        run: |
          for asset in Talio-6.0.29-arm64.dmg Talio-6.0.29-arm64.zip Talio-6.0.29-x64.dmg Talio-6.0.29-x64.zip Talio.Setup.6.0.29.exe Talio-6.0.29-x86_64.AppImage Talio-6.0.29-amd64.deb; do
            test -s "release-assets/$asset" || exit 1
          done
          cd release-assets
          sha256sum *.dmg *.zip *.exe *.AppImage *.deb > SHA256SUMS.txt
      - name: Publish v6.0.29
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.0.29
          target_commitish: ${{ github.sha }}
          name: Talio Desktop 6.0.29 — Faster Mira executor and guarded Jev decisions
          draft: true
          prerelease: false
          generate_release_notes: false
          body: |
            DeepSeek now prepares a bounded, task-local plan for supported same-app desktop steps. On macOS, Jev selects among freshly observed accessibility controls. Signed plans are scoped to the authenticated user and tenant, expire after five minutes, and never authorize arbitrary code or completion claims. Low-confidence, stale or unavailable selections fall back to the existing visual planner.

            Native helpers stay warm for the task instead of restarting for every input. Execution uses shorter input delays, bounded model deadlines and Retry-After-aware retries. Uncertain native inputs are never automatically replayed; completed structured plans receive fresh visual verification. Existing consent, foreground checks, emergency stop and protected-app rules remain in place.

            Jev semantic selection currently requires macOS accessibility controls. Windows and Linux use the improved persistent native helper and existing visual planning. TypeSafe credentials remain server-side and are not embedded in installers.

            Mira's current UI, floating robot, detail widgets, direct DeepSeek voice generation, expressive voice playback, concise replies and dismissal commands are preserved. Web changes arrive through the hosted Talio app, not the installers.

            Validated with the Mira regression suite, Swift type checking, a production web build and synthetic live DeepSeek/Jev calls. Synthetic latency is not a guarantee for real multi-step desktop tasks. Hands-on desktop-action acceptance on every operating system has not been performed.

            CI rebuilds local Agent S runtimes and installers for macOS Apple Silicon and Intel, Windows x64 and Linux x64, then verifies all seven installers and their uploaded SHA-256 digests before publication.

            Signing: CI packages are not Developer ID signed or Apple notarized; Windows packages are unsigned. macOS desktop control requires macOS 14+, Accessibility and Screen Recording approval. Linux desktop control requires X11.
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.zip
            release-assets/**/*.exe
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/SHA256SUMS.txt
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify uploaded assets and publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v6.0.29 --repo "${{ github.repository }}" --json assets --jq '.assets' | node -e '
            let text = "";
            process.stdin.on("data", chunk => text += chunk);
            process.stdin.on("end", () => {
              const assets = JSON.parse(text);
              const expected = ["Talio-6.0.29-arm64.dmg", "Talio-6.0.29-arm64.zip", "Talio-6.0.29-x64.dmg", "Talio-6.0.29-x64.zip", "Talio.Setup.6.0.29.exe", "Talio-6.0.29-x86_64.AppImage", "Talio-6.0.29-amd64.deb", "SHA256SUMS.txt"];
              for (const name of expected) {
                const asset = assets.find(item => item.name === name);
                if (!asset || asset.size < (name.endsWith(".txt") ? 100 : 1048576)) throw new Error("Missing or truncated release asset: " + name);
                const file = require("fs").readFileSync("release-assets/" + name);
                const digest = "sha256:" + require("crypto").createHash("sha256").update(file).digest("hex");
                if (asset.digest !== digest) throw new Error("Uploaded asset checksum mismatch: " + name);
              }
            });'
          gh release edit v6.0.29 --repo "${{ github.repository }}" --draft=false --latest
