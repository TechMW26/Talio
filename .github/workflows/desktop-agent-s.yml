name: Desktop local Agent S builds
on:
  workflow_dispatch:
  push:
    tags:
      - 'v6.0.27'
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin
            arch: arm64
            target: mac
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            target: mac
          - runner: windows-2022
            platform: win32
            arch: x64
            target: win
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            target: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux runtime utilities
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 xclip x11-utils wmctrl xvfb
      - run: npm ci
        working-directory: desktop-app
      - name: Build local planner runtime
        if: runner.os != 'Linux'
        run: npm run build:agent-s
        working-directory: desktop-app
      - name: Build local planner runtime (X11)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run build:agent-s
        working-directory: desktop-app
      - name: Archive native runtime preserving executable permissions
        run: tar -czf agent-s-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz -C desktop-app/build agent-s-${{ matrix.platform }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: agent-s-${{ matrix.platform }}-${{ matrix.arch }}
          path: agent-s-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: Package desktop (no automatic publication)
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        working-directory: desktop-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop-app/dist/*.dmg
            desktop-app/dist/*.zip
            desktop-app/dist/*.exe
            desktop-app/dist/*.AppImage
            desktop-app/dist/*.deb
          if-no-files-found: error

  publish:
    name: Publish desktop release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete installer set
        run: |
          for asset in Talio-6.0.27-arm64.dmg Talio-6.0.27-arm64.zip Talio-6.0.27-x64.dmg Talio-6.0.27-x64.zip Talio.Setup.6.0.27.exe Talio-6.0.27-x86_64.AppImage Talio-6.0.27-amd64.deb; do
            test -s "release-assets/$asset" || exit 1
          done
          cd release-assets
          sha256sum *.dmg *.zip *.exe *.AppImage *.deb > SHA256SUMS.txt
      - name: Publish v6.0.27
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.0.27
          target_commitish: ${{ github.sha }}
          name: Talio Desktop 6.0.27 — Floating Mira robot
          draft: true
          prerelease: false
          generate_release_notes: false
          body: |
            Mira now uses the circular robot-heads avatar with a #787878 shell, Black trim, White screen and no antenna. It replaces the particle orb across Mira's interface.

            Desktop mini-mode is a transparent floating robot face without a card, frame, background or status bar. Click to restore Mira, drag to move, or press Escape to close. Web mini-mode stays transparently inside the page because browser-owned detached windows cannot be made frameless and transparent.

            Animated expressions follow listening, thinking, searching, speaking, working, success and errors. Listening includes small acknowledgement nods; the face tracks the pointer and visually sleeps after 60 seconds of inactivity. Sleep does not end calls or change microphone access. The animation clock follows the detached window so the face stays animated while the main app is hidden.

            Existing direct DeepSeek generation, expressive voice playback, concise replies, fillers and English/Hindi dismissal commands are preserved. Web interface changes are delivered through the hosted Talio app; the desktop installers do not embed the web application.

            CI builds macOS Apple Silicon and Intel, Windows x64, and Linux x64 installers with freshly rebuilt local Agent S runtimes. Hands-on microphone and desktop-action acceptance on every operating system has not been performed.

            Signing: CI packages are not Developer ID signed or Apple notarized; Windows packages are unsigned. macOS desktop control requires macOS 14+, Accessibility and Screen Recording approval. Linux desktop control requires X11.
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.zip
            release-assets/**/*.exe
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/SHA256SUMS.txt
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify uploaded assets and publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v6.0.27 --repo "${{ github.repository }}" --json assets --jq '.assets' | node -e '
            let text = "";
            process.stdin.on("data", chunk => text += chunk);
            process.stdin.on("end", () => {
              const assets = JSON.parse(text);
              const expected = ["Talio-6.0.27-arm64.dmg", "Talio-6.0.27-arm64.zip", "Talio-6.0.27-x64.dmg", "Talio-6.0.27-x64.zip", "Talio.Setup.6.0.27.exe", "Talio-6.0.27-x86_64.AppImage", "Talio-6.0.27-amd64.deb", "SHA256SUMS.txt"];
              for (const name of expected) {
                const asset = assets.find(item => item.name === name);
                if (!asset || asset.size < (name.endsWith(".txt") ? 100 : 1048576)) throw new Error("Missing or truncated release asset: " + name);
                const file = require("fs").readFileSync("release-assets/" + name);
                const digest = "sha256:" + require("crypto").createHash("sha256").update(file).digest("hex");
                if (asset.digest !== digest) throw new Error("Uploaded asset checksum mismatch: " + name);
              }
            });'
          gh release edit v6.0.27 --repo "${{ github.repository }}" --draft=false --latest
