name: Native web release checks
on:
  pull_request:
    branches: [main]
    paths-ignore: ['desktop-app/**', 'talioapp/**', 'docs/**', '**/*.md']
  push:
    branches: [main]
    paths-ignore: ['desktop-app/**', 'talioapp/**', 'docs/**', '**/*.md']
permissions:
  contents: read
concurrency:
  group: web-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run release:check
